# Release mod zips. Manual trigger only: mods are not versioned individually, so there
# are no per-mod tags. Builds one install-ready zip per mod (<Mod>.zip, top folder is the
# mod: romfs/ + exefs/ plus its mod.json and README.md), uploads them as artifacts, and
# publishes them on a rolling `latest` release.
#
# Run from the Actions tab, or: gh workflow run release.yml [--ref main] [-f mod=Timer]
name: Release mod zips

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to package
        type: choice
        default: all
        options: [all, Timer, ClassicGP, SecretTracks]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate mod.json files
        run: python3 tools/validate.py

      - name: Build zips
        run: |
          mkdir -p dist
          if [ "${{ inputs.mod }}" = "all" ]; then MODS="Timer ClassicGP SecretTracks"; else MODS="${{ inputs.mod }}"; fi
          for m in $MODS; do
            [ -d "$m" ] || { echo "$m: no such mod"; exit 1; }
            rm -f "dist/$m.zip"
            zip -qr "dist/$m.zip" "$m" -x '*/manifest.tsv'
          done
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mod-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.mod }}" = "all" ]; then MODS="Timer ClassicGP SecretTracks"; else MODS="${{ inputs.mod }}"; fi
          NOTES="Mods for mkw-recomp (MKW 1.8.0), built from ${GITHUB_SHA}. Top folder of each zip is the mod: import it from the start screen's Mods page, or extract it for emulators."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest mod zips" --notes "$NOTES"
          for m in $MODS; do
            gh release upload latest "dist/$m.zip" --clobber
          done
